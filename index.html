<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المدرسة | Smart School</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* Form Section */
        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-section h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        input, select, button {
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        button.btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background-color: var(--primary-hover);
        }

        /* Table Section */
        .table-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            color: #374151;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-delete:hover {
            background-color: #fca5a5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏫 نظام إدارة المدرسة الذكي</h1>
        <p>لوحة التحكم في الطلاب والإحصائيات العامة</p>
    </header>

    <!-- الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>إجمالي الطلاب</h3>
            <p id="total-students">0</p>
        </div>
        <div class="stat-card">
            <h3>إجمالي المعلمين</h3>
            <p>24</p>
        </div>
        <div class="stat-card">
            <h3>الفصول الدراسية</h3>
            <p>12</p>
        </div>
    </div>

    <!-- نموذج إضافة طالب -->
    <div class="form-section">
        <h2>إضافة طالب جديد</h2>
        <form id="student-form" class="form-grid">
            <input type="text" id="student-name" placeholder="اسم الطالب" required>
            <select id="student-stage" required>
                <option value="">اختر المرحلة</option>
                <option value="الابتدائية">الابتدائية</option>
                <option value="الإعدادية">الإعدادية</option>
                <option value="الثانوية">الثانوية</option>
            </select>
            <input type="text" id="student-grade" placeholder="الصف (مثال: الأول)" required>
            <button type="submit" class="btn-add">إضافة الطالب</button>
        </form>
    </div>

    <!-- جدول قائمة الطلاب -->
    <div class="table-section">
        <h2>قائمة الطلاب المسجلين</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الاسم</th>
                    <th>المرحلة</th>
                    <th>الصف</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="student-list">
                <!-- الطلاب سيظهرون هنا -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let students = [
        { id: 1, name: "أحمد محمد", stage: "الثانوية", grade: "الأول" },
        { id: 2, name: "سارة محمود", stage: "الإعدادية", grade: "الثاني" }
    ];

    function renderStudents() {
        const list = document.getElementById("student-list");
        list.innerHTML = "";

        students.forEach((student, index) => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${student.name}</td>
                <td>${student.stage}</td>
                <td>${student.grade}</td>
                <td><button class="btn-delete" onclick="deleteStudent(${student.id})">حذف</button></td>
            `;
            list.appendChild(row);
        });

        document.getElementById("total-students").textContent = students.length;
    }

    document.getElementById("student-form").addEventListener("submit", function(e) {
        e.preventDefault();
        const name = document.getElementById("student-name").value;
        const stage = document.getElementById("student-stage").value;
        const grade = document.getElementById("student-grade").value;

        const newStudent = {
            id: Date.now(),
            name: name,
            stage: stage,
            grade: grade
        };

        students.push(newStudent);
        renderStudents();
        this.reset();
    });

    function deleteStudent(id) {
        students = students.filter(student => student.id !== id);
        renderStudents();
    }

    // التشغيل الأولي
    renderStudents();
</script>

</body>
</html>
